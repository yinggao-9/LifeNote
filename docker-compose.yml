# PostgreSQL for local development.
#
# The machine this project was set up on already runs an equivalent container named "LifeNote":
#   docker exec LifeNote psql -U postgres -c "CREATE DATABASE lifenote"
# If you use that one, do NOT start this compose file as well - both bind port 5432.
# To use compose instead: docker stop LifeNote && docker compose up -d
#
# Usage: docker compose up -d | docker compose down | docker compose down -v (wipe data)
services:
  db:
    image: postgres:16
    container_name: lifenote-db
    environment:
      POSTGRES_DB: lifenote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifenote"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
