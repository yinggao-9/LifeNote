spring:
  # loads local-secrets.yml (JWT key + AWS keys); the file lives at the project root so it
  # stays out of git and out of the packaged jar. "optional" keeps startup working without it.
  config:
    import: optional:file:local-secrets.yml
  autoconfigure:
    # DeepSeek's starter aborts startup when no api-key is configured, so its
    # ChatClient is built by hand in AiConfig instead. The chat-client
    # auto-config injects ChatModel by type and is ambiguous with two
    # providers present - also excluded there.
    exclude: >-
      org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration,
      org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/lifenote
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      # schema is owned by Flyway; Hibernate only checks that the mappings match
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # lets Flyway adopt a database that already contains users/user_settings
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

jwt:
  secret-key: ${JWT_SECRET_KEY:}
  ttl: 7200000
  token-name: token

app:
  s3:
    region: ${AWS_REGION:eu-north-1}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    bucket: ${AWS_BUCKET:ying-demon-bucket-850610451023-eu-north-1-an}

spring.ai:
  openai:
    # placeholder lets the ChatClient bean start without a real key;
    # AI calls fail at runtime and documents end up FAILED (retryable), which is the intended behaviour for now
    api-key: ${OPENAI_API_KEY:sk-placeholder}
    chat:
      options:
        model: gpt-4o-mini
  # DeepSeek credentials and options live in local-secrets.yml under
  # spring.ai.deepseek. When that key is absent the deepseek bean in AiConfig
  # is skipped and the app runs on OpenAI alone.
